<html><head><meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
    <title>jOrgChart - A jQuery OrgChart Plugin</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/jquery.jOrgChart.css">
    <link rel="stylesheet" href="css/custom.css">
    <link href="css/prettify.css" type="text/css" rel="stylesheet">

    <script type="text/javascript" src="js/prettify.js"></script>
    
    <!-- jQuery includes -->
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.8.16/jquery-ui.min.js"></script>
    
    <script src="js/jquery.jOrgChart.js"></script>

    <script>
    jQuery(document).ready(function() {
        $("#org").jOrgChart({
            chartElement : '#chart',
            dragAndDrop  : true
        });
    });
    </script>
  </head>

  <body onload="prettyPrint();">
    <div class="topbar">
        
    </div>
    
            
    
    <div id="chart" class="orgChart"><div class="jOrgChart">
	
	<table cellpadding="0" cellspacing="0" border="0"><tbody>
		<tr class="node-cells"><td class="node-cell" colspan="8">
		
		</td></tr>
		<tr><td colspan="8"><div class="line down"></div></td></tr>
		<tr><td class="line left">&nbsp;</td><td class="line right top">&nbsp;</td><td class="line left top">&nbsp;</td><td class="line right top">&nbsp;</td><td class="line left top">&nbsp;</td><td class="line right top">&nbsp;</td><td class="line left top">&nbsp;</td><td class="line right">&nbsp;</td></tr>
		<tr>
			<td class="" colspan="2">
				<table cellpadding="0" cellspacing="0" border="0"><tbody><tr class="node-cells"><td class="node-cell" colspan="2"><div class="node "><br><br><br><br><br>Person1<br>Department<br>Designation</div></td></tr></tbody>
				</table>
			</td>
			<td class="node-container" colspan="2">
				<table cellpadding="0" cellspacing="0" border="0"><tbody><tr class="node-cells"><td class="node-cell" colspan="2"><div class="node ui-draggable ui-droppable"><br><br><br><br><br>Person1<br>Department<br>Designation</div></td></tr></tbody>
				</table>
			</td>
			<td class="node-container" colspan="2">
				<table cellpadding="0" cellspacing="0" border="0"><tbody><tr class="node-cells"><td class="node-cell" colspan="2"><div class="node ui-draggable ui-droppable"><br><br><br><br><br>Person1<br>Department<br>Designation</div></td></tr></tbody></table>
			</td>
			<td class="node-container" colspan="2">
				<table cellpadding="0" cellspacing="0" border="0"><tbody><tr class="node-cells"><td class="node-cell" colspan="2"><div class="node ui-draggable ui-droppable"><br><br><br><br><br>Person1<br>Department<br>Designation</div></td></tr></tbody>
				</table>
			</td>
		</tr>
				
		</tbody></table>
		
		</div></div>
    
    <script>
        jQuery(document).ready(function() {
            
            /* Custom jQuery for the example */
            $("#show-list").click(function(e){
                e.preventDefault();
                
                $('#list-html').toggle('fast', function(){
                    if($(this).is(':visible')){
                        $('#show-list').text('Hide underlying list.');
                        $(".topbar").fadeTo('fast',0.9);
                    }else{
                        $('#show-list').text('Show underlying list.');
                        $(".topbar").fadeTo('fast',1);                  
                    }
                });
            });
            
            $('#list-html').text($('#org').html());
            
            $("#org").bind("DOMSubtreeModified", function() {
                $('#list-html').text('');
                
                $('#list-html').text($('#org').html());
                
                prettyPrint();                
            });
        });
    </script>


</body></html>
